name: backend

on:
  push:
    branches: [main, "feature/**"]
    paths: ["src/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, "feature/**"]
    paths: ["src/backend/**", ".github/workflows/backend.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
