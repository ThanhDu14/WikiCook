openapi: 3.0.3
info:
  title: WikiCook – AI Weekly Meal Planner API (spec 031)
  version: 0.1.0
  description: |
    API tạo thực đơn tuần bằng AI. Mọi endpoint yêu cầu đăng nhập (JWT, spec 010) và chỉ làm việc
    với kế hoạch của chính người gọi. Draft không được lưu trên server; chỉ `confirm` ghi vào
    meal plan (qua MealPlanWriteFacade của spec 030). Lỗi dạng ProblemDetail (RFC 9457) có `code`.
    Kiểu Day, Meal, ItemSource, DietType giống contracts/openapi.yaml của spec 030.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: ai-planner

paths:
  /ai-planner/weeks/{weekStart}/options:
    get:
      tags: [ai-planner]
      summary: Dữ liệu cho dialog ràng buộc (giá trị mặc định từ hồ sơ, ngày chọn được, lượt còn lại)
      operationId: getGenerationOptions
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      responses:
        '200':
          description: Tùy chọn tạo thực đơn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationOptions' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /ai-planner/weeks/{weekStart}/generations:
    post:
      tags: [ai-planner]
      summary: Tạo bản nháp cho các ô trống được chọn (đồng bộ, tối đa 60 s)
      description: |
        Trả 200 với `mode = AI` (bản nháp AI) hoặc `mode = AUTO` (bản nháp dự phòng không dùng AI,
        khi AI lỗi, quá 60 s, trả kết quả không dùng được 2 lần, hoặc hết hạn mức ngày).
        Chỉ `mode = AI` tính vào 5 lượt/giờ.
      operationId: generateDraft
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: Bản nháp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409':
          description: GENERATION_IN_PROGRESS – người dùng đã có một lượt đang chạy
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: NOT_ENOUGH_RECIPES, PAST_WEEK hoặc NO_EMPTY_SLOT
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NotEnoughRecipesProblem'
                  - $ref: '#/components/schemas/Problem'
        '429':
          description: RATE_LIMITED – đã dùng hết 5 lượt trong 60 phút
          headers:
            Retry-After:
              schema: { type: integer }
              description: Số giây tới khi có lượt mới
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RateLimitedProblem' }
        '503':
          description: BACKUP_UNAVAILABLE – cả AI và bản nháp dự phòng đều không tạo được
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /ai-planner/generations/{requestId}:
    delete:
      tags: [ai-planner]
      summary: Hủy lượt tạo đang chạy (FR-023); lượt bị hủy không tính vào giới hạn
      description: |
        Cũng dùng khi client mất mạng lúc đang tạo và không nhận được bản nháp. Nếu lượt đã kết thúc
        với outcome AI_DRAFT, chưa confirm và chưa quá 10 phút, server đổi outcome thành CANCELLED
        nên lượt không tính vào 5 lượt/giờ. Lượt đó vẫn tính vào hạn mức ngày. Xem research R9.
      operationId: cancelGeneration
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Đã hủy, hoặc lượt đã kết thúc (idempotent) }
        '401': { $ref: '#/components/responses/Problem' }

  /ai-planner/weeks/{weekStart}/confirm:
    post:
      tags: [ai-planner]
      summary: Lưu bản nháp vào kế hoạch tuần (FR-018, FR-019)
      description: |
        Lưu trong một transaction. Bỏ qua ô đã có món (đổi từ thiết bị khác) và công thức không còn
        PUBLISHED. Sau khi thành công, frontend mở /shopping-list/import?weekStart=… (spec 040).
      operationId: confirmDraft
      parameters:
        - $ref: '#/components/parameters/WeekStart'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
      responses:
        '200':
          description: Kết quả lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /ai-planner/weeks/{weekStart}/suggestions:
    get:
      tags: [ai-planner]
      summary: '"Gợi ý cho bạn" cho một ô – chỉ dùng truy hồi, không gọi LLM (FR-033 – FR-038)'
      description: |
        Không tính vào giới hạn 5 lượt/giờ và không ghi ai_requests. Quá 2,5 s hoặc dịch vụ embedding
        lỗi → 503; frontend ẩn danh sách sau 3 s mà không báo lỗi.
      operationId: getSlotSuggestions
      parameters:
        - $ref: '#/components/parameters/WeekStart'
        - { name: day, in: query, required: true, schema: { $ref: '#/components/schemas/Day' } }
        - { name: meal, in: query, required: true, schema: { $ref: '#/components/schemas/Meal' } }
        - name: exclude
          in: query
          required: false
          description: Id công thức đang có trong bản nháp đang mở (coi như "đã lên kế hoạch")
          style: form
          explode: false
          schema:
            type: array
            maxItems: 21
            items: { type: integer, format: int64 }
      responses:
        '200':
          description: Tối đa 5 gợi ý (có thể rỗng)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionList' }
        '401': { $ref: '#/components/responses/Problem' }
        '503':
          description: SUGGESTIONS_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WeekStart:
      name: weekStart
      in: path
      required: true
      description: Thứ Hai đầu tuần theo giờ Việt Nam (YYYY-MM-DD)
      schema: { type: string, format: date }

  responses:
    Problem:
      description: Lỗi (VALIDATION_ERROR, INVALID_WEEK_START, UNAUTHENTICATED…)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Day:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    Meal:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER]
    ItemSource:
      type: string
      enum: [MANUAL, AI, AUTO]
    DietType:
      type: string
      enum: [NONE, VEGETARIAN, VEGAN, PESCATARIAN]

    SlotKey:
      type: object
      required: [day, meal]
      properties:
        day: { $ref: '#/components/schemas/Day' }
        meal: { $ref: '#/components/schemas/Meal' }

    GenerationConstraints:
      type: object
      required: [allergenIds, excludedIngredientIds, dietType, preferredCuisineIds]
      properties:
        allergenIds:
          type: array
          items: { type: integer, format: int64 }
        excludedIngredientIds:
          type: array
          items: { type: integer, format: int64 }
        dietType: { $ref: '#/components/schemas/DietType' }
        servings:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: null = "Theo công thức" (mỗi món dùng servings của công thức)
        maxCookTimeMinutes:
          type: integer
          minimum: 10
          nullable: true
        preferredCuisineIds:
          type: array
          items: { type: integer, format: int64 }

    GenerationOptions:
      type: object
      required: [weekStart, selectableDays, emptySlots, defaults, profileIncomplete, remaining, aiAvailableToday]
      properties:
        weekStart: { type: string, format: date }
        selectableDays:
          type: array
          description: Rỗng với tuần đã qua; từ hôm nay với tuần hiện tại
          items: { $ref: '#/components/schemas/Day' }
        emptySlots:
          type: array
          description: Ô trống còn tạo được; bỏ ngày đã qua và bữa của hôm nay đã qua giờ chốt (10:00 / 14:00 / 20:00 giờ VN)
          items: { $ref: '#/components/schemas/SlotKey' }
        defaults: { $ref: '#/components/schemas/GenerationConstraints' }
        profileIncomplete: { type: boolean, description: Hồ sơ chưa có thông tin ăn uống (FR-006) }
        remaining: { type: integer, minimum: 0, maximum: 5 }
        nextAvailableAt:
          type: string
          format: date-time
          nullable: true
          description: Có giá trị khi remaining = 0
        aiAvailableToday: { type: boolean, description: false khi hết hạn mức ngày của nền tảng }

    GenerateRequest:
      type: object
      required: [requestId, days, meals, constraints]
      properties:
        requestId: { type: string, format: uuid, description: Do client sinh, dùng để hủy }
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { $ref: '#/components/schemas/Day' }
        meals:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/Meal' }
        constraints: { $ref: '#/components/schemas/GenerationConstraints' }

    DraftItem:
      type: object
      required: [day, meal, recipeId, recipeName, source]
      properties:
        day: { $ref: '#/components/schemas/Day' }
        meal: { $ref: '#/components/schemas/Meal' }
        recipeId: { type: integer, format: int64 }
        recipeName: { type: string }
        coverImageUrl: { type: string, nullable: true }
        totalTimeMinutes: { type: integer, nullable: true }
        servings: { type: integer, minimum: 1, maximum: 20, nullable: true }
        source: { $ref: '#/components/schemas/ItemSource' }
        dietType: { $ref: '#/components/schemas/DietType' }

    DraftResponse:
      type: object
      required: [requestId, weekStart, mode, items, chooseSlots, removedPicks, remaining]
      properties:
        requestId: { type: string, format: uuid }
        weekStart: { type: string, format: date }
        mode: { type: string, enum: [AI, AUTO] }
        notice:
          type: string
          nullable: true
          enum: [AUTO_NO_AI, AI_DAILY_CAP]
          description: 'AUTO_NO_AI → "Tạo tự động, không dùng AI"; AI_DAILY_CAP → "AI đã hết lượt hôm nay"'
        items:
          type: array
          items: { $ref: '#/components/schemas/DraftItem' }
        chooseSlots:
          type: array
          description: Ô đánh dấu "Chọn món" (pick bị loại hoặc không đủ món)
          items: { $ref: '#/components/schemas/SlotKey' }
        removedPicks: { type: integer }
        remaining: { type: integer }
        nextAvailableAt: { type: string, format: date-time, nullable: true }

    ConfirmRequest:
      type: object
      required: [requestId, items]
      properties:
        requestId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 21
          items:
            type: object
            required: [day, meal, recipeId, source]
            properties:
              day: { $ref: '#/components/schemas/Day' }
              meal: { $ref: '#/components/schemas/Meal' }
              recipeId: { type: integer, format: int64 }
              servings: { type: integer, minimum: 1, maximum: 20, nullable: true }
              source: { $ref: '#/components/schemas/ItemSource' }

    ConfirmResult:
      type: object
      required: [saved, skippedOccupied, skippedUnavailable]
      properties:
        saved: { type: integer }
        skippedOccupied: { type: integer }
        skippedUnavailable: { type: integer }

    Suggestion:
      type: object
      required: [recipeId, title, reason]
      properties:
        recipeId: { type: integer, format: int64 }
        title: { type: string }
        coverImageUrl: { type: string, nullable: true }
        totalTimeMinutes: { type: integer, nullable: true }
        cuisineName: { type: string, nullable: true }
        reason: { type: string, example: 'Món sáng · Việt Nam · 20 phút' }

    SuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Suggestion' }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_WEEK_START
            - UNAUTHENTICATED
            - PAST_WEEK
            - NO_EMPTY_SLOT
            - NOT_ENOUGH_RECIPES
            - RATE_LIMITED
            - GENERATION_IN_PROGRESS
            - BACKUP_UNAVAILABLE
            - SUGGESTIONS_UNAVAILABLE

    NotEnoughRecipesProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [eligibleCount, requestedSlots, suggestions]
          properties:
            eligibleCount: { type: integer }
            requestedSlots: { type: integer }
            suggestions:
              type: array
              items:
                type: string
                enum: [INCREASE_MAX_COOK_TIME, REMOVE_PREFERRED_CUISINES, SELECT_FEWER_SLOTS]

    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [nextAvailableAt]
          properties:
            nextAvailableAt: { type: string, format: date-time }
