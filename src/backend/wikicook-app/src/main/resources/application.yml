# Connection settings come from the environment (DB_URL, DB_USER, DB_PASSWORD); no secrets in this file.
# For local development use the "local" profile, which points at docker-compose (src/backend/docker-compose.yml).
spring:
  application:
    name: wikicook
  # Generation waits up to 60 s on the provider (031 research R9).
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (wikicook-db); Hibernate only checks entities against it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # V102-V104 (spec 010) are lower than V403 that already ran (research R11)
    out-of-order: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  # Avatar upload (spec 011 R7): 5 MB file, 6 MB request; resolve-lazily so the size error is raised after the handler
  # is chosen and the advice of com.wikicook.profile can answer it with AVATAR_TOO_LARGE.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      resolve-lazily: true
  # "servings": 2.5 is a 400, not silently 2 (030 edge case servings).
  jackson:
    deserialization:
      accept-float-as-int: false

# Correct client IP behind nginx (sign-in throttle, audit ip_address)
server:
  forward-headers-strategy: native
  tomcat:
    max-swallow-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # An unreachable SMTP server must not turn /actuator/health DOWN (research R8)
    mail:
      enabled: false

wikicook:
  # Defaults live in AiProperties (wikicook-ai); every key can be overridden by its WIKICOOK_AI_* variable.
  ai:
    mode: ${WIKICOOK_AI_MODE:mock}
    api-key: ${WIKICOOK_AI_API_KEY:}
    llm:
      model: ${WIKICOOK_AI_LLM_MODEL:gemini-3.5-flash}
      timeout: 60s
    embedding:
      model: ${WIKICOOK_AI_EMBEDDING_MODEL:gemini-embedding-001}
      dimensions: 768
      reconcile-on-startup: ${WIKICOOK_AI_EMBEDDING_RECONCILE_ON_STARTUP:false}
      reconcile-limit: ${WIKICOOK_AI_EMBEDDING_RECONCILE_LIMIT:0}
      batch-size: 50
      batch-pause: ${WIKICOOK_AI_EMBEDDING_BATCH_PAUSE:30s}
    daily-cap:
      total: ${WIKICOOK_AI_DAILY_CAP_TOTAL:100}
      meal-planner-share: 0.7
      nutrition-share: 0.3
  # Spec 010 (com.wikicook.auth). Secrets come only from the environment.
  # No spring.security.oauth2.client.registration here: Spring Boot rejects an empty client-id at startup,
  # so the Google registration is built in code when the id is set. No issuer-uri either (research R7, NFR-005).
  auth:
    jwt-secret: ${WIKICOOK_JWT_SECRET:}
    email-hash-key: ${WIKICOOK_EMAIL_HASH_KEY:}
    public-base-url: ${WIKICOOK_PUBLIC_BASE_URL:http://localhost:3000}
    cookie-secure: ${WIKICOOK_AUTH_COOKIE_SECURE:true}
    bcrypt-strength: 12
    access-token-ttl: 15m
    mail-from: ${WIKICOOK_MAIL_FROM:no-reply@wikicook.local}
    # Compose passes an unset variable as an empty string; AuthProperties.appealContact() falls back to mail-from.
    appeal-contact: ${WIKICOOK_APPEAL_CONTACT:}
    sign-in:
      ip-limit: ${WIKICOOK_AUTH_SIGN_IN_IP_LIMIT:100}
    jobs:
      enabled: true
    google:
      client-id: ${WIKICOOK_GOOGLE_CLIENT_ID:}
      client-secret: ${WIKICOOK_GOOGLE_CLIENT_SECRET:}
    # First Administrator: created at startup only when both are set and no active Administrator exists (spec 010).
    bootstrap-admin:
      email: ${WIKICOOK_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${WIKICOOK_BOOTSTRAP_ADMIN_PASSWORD:}
  # Spec 011 (com.wikicook.profile): where avatars are stored, and writes per hour per kind (NFR-008).
  profile:
    media-dir: ${WIKICOOK_MEDIA_DIR:./.media}
    write-limit-per-hour: 20
  # Uploaded media (avatars, Cooksnaps): local disk under profile.media-dir, or a private S3 bucket.
  # Credentials are never set here: IAM role on AWS, otherwise AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
  media:
    storage: ${WIKICOOK_MEDIA_STORAGE:local}
    # CloudFront in front of the bucket, e.g. https://dxxxx.cloudfront.net; blank = serve through /api/v1/media/**
    public-base-url: ${WIKICOOK_MEDIA_PUBLIC_BASE_URL:}
    s3:
      bucket: ${WIKICOOK_MEDIA_S3_BUCKET:}
      region: ${WIKICOOK_MEDIA_S3_REGION:${AWS_REGION:}}
      # Only for LocalStack/MinIO in development
      endpoint: ${WIKICOOK_MEDIA_S3_ENDPOINT:}
  # Dev stand-ins for 010/011 (com.wikicook.devstub); never enable in production.
  dev-stubs:
    enabled: ${WIKICOOK_DEV_STUBS_ENABLED:false}
    user-id: ${WIKICOOK_DEV_STUBS_USER_ID:1}
