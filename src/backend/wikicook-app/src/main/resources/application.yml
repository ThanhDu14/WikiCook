# Connection settings come from the environment (DB_URL, DB_USER, DB_PASSWORD); no secrets in this file.
# For local development use the "local" profile, which points at docker-compose (src/backend/docker-compose.yml).
spring:
  application:
    name: wikicook
  # Generation waits up to 60 s on the provider (031 research R9).
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (wikicook-db); Hibernate only checks entities against it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

wikicook:
  # Defaults live in AiProperties (wikicook-ai); every key can be overridden by its WIKICOOK_AI_* variable.
  ai:
    mode: ${WIKICOOK_AI_MODE:mock}
    api-key: ${WIKICOOK_AI_API_KEY:}
    llm:
      model: ${WIKICOOK_AI_LLM_MODEL:gemini-2.5-flash}
      timeout: 60s
    embedding:
      model: ${WIKICOOK_AI_EMBEDDING_MODEL:gemini-embedding-001}
      dimensions: 768
      reconcile-on-startup: ${WIKICOOK_AI_EMBEDDING_RECONCILE_ON_STARTUP:false}
      reconcile-limit: ${WIKICOOK_AI_EMBEDDING_RECONCILE_LIMIT:0}
      batch-size: 50
      batch-pause: ${WIKICOOK_AI_EMBEDDING_BATCH_PAUSE:30s}
    daily-cap:
      total: ${WIKICOOK_AI_DAILY_CAP_TOTAL:100}
      meal-planner-share: 0.7
      nutrition-share: 0.3
