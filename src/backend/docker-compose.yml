# Local dev infrastructure.
#   docker compose up -d db          # PostgreSQL 16 + pgvector on localhost:5432
#   docker compose run --rm migrate  # apply Flyway migrations from wikicook-db
#   docker compose up -d --build app # Spring Boot app on localhost:8080 (runs Flyway itself on startup)
# Run from src/backend. Credentials can be overridden in src/backend/.env (git-ignored).
name: wikicook

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wikicook}
      POSTGRES_USER: ${POSTGRES_USER:-wikicook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikicook}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: wikicook-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-wikicook}
      DB_USER: ${POSTGRES_USER:-wikicook}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wikicook}
      WIKICOOK_AI_MODE: ${WIKICOOK_AI_MODE:-mock}
      WIKICOOK_AI_API_KEY: ${WIKICOOK_AI_API_KEY:-}
      WIKICOOK_AI_DAILY_CAP_TOTAL: ${WIKICOOK_AI_DAILY_CAP_TOTAL:-100}
      WIKICOOK_AI_EMBEDDING_RECONCILE_ON_STARTUP: ${WIKICOOK_AI_EMBEDDING_RECONCILE_ON_STARTUP:-false}
      WIKICOOK_AI_EMBEDDING_RECONCILE_LIMIT: ${WIKICOOK_AI_EMBEDDING_RECONCILE_LIMIT:-0}
      WIKICOOK_DEV_STUBS_ENABLED: ${WIKICOOK_DEV_STUBS_ENABLED:-false}
      WIKICOOK_DEV_STUBS_USER_ID: ${WIKICOOK_DEV_STUBS_USER_ID:-1}
      # Auth (spec 010). JWT secret and email-hash key are required: compose fails with the message below when missing.
      WIKICOOK_JWT_SECRET: ${WIKICOOK_JWT_SECRET:?set WIKICOOK_JWT_SECRET in src/backend/.env (at least 32 bytes, see .env.example)}
      WIKICOOK_EMAIL_HASH_KEY: ${WIKICOOK_EMAIL_HASH_KEY:?set WIKICOOK_EMAIL_HASH_KEY in src/backend/.env (see .env.example)}
      WIKICOOK_PUBLIC_BASE_URL: ${WIKICOOK_PUBLIC_BASE_URL:-http://localhost:3000}
      WIKICOOK_AUTH_COOKIE_SECURE: ${WIKICOOK_AUTH_COOKIE_SECURE:-false}
      WIKICOOK_AUTH_SIGN_IN_IP_LIMIT: ${WIKICOOK_AUTH_SIGN_IN_IP_LIMIT:-100}
      MAIL_HOST: mailpit
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      WIKICOOK_MAIL_FROM: ${WIKICOOK_MAIL_FROM:-no-reply@wikicook.local}
      WIKICOOK_APPEAL_CONTACT: ${WIKICOOK_APPEAL_CONTACT:-${WIKICOOK_MAIL_FROM:-no-reply@wikicook.local}}
      WIKICOOK_GOOGLE_CLIENT_ID: ${WIKICOOK_GOOGLE_CLIENT_ID:-}
      WIKICOOK_GOOGLE_CLIENT_SECRET: ${WIKICOOK_GOOGLE_CLIENT_SECRET:-}
      WIKICOOK_BOOTSTRAP_ADMIN_EMAIL: ${WIKICOOK_BOOTSTRAP_ADMIN_EMAIL:-}
      WIKICOOK_BOOTSTRAP_ADMIN_PASSWORD: ${WIKICOOK_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Avatars (spec 011 R7): local disk on the media volume
      WIKICOOK_MEDIA_DIR: /var/lib/wikicook/media
      # Cooksnaps (spec 070): same volume, /app is not writable by user wikicook
      WIKICOOK_REVIEW_STORAGE_ROOTPATH: /var/lib/wikicook/media/cooksnaps
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - media:/var/lib/wikicook/media
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10

  # Dev SMTP sink for verification and notification emails (spec 010): web UI on http://localhost:8025.
  # app does not depend_on it: mail is sent after commit and a missing SMTP server must not stop the app.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Same Flyway history table the Spring Boot app will use later, so the app sees these as applied.
  migrate:
    image: flyway/flyway:11
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-wikicook}
      FLYWAY_USER: ${POSTGRES_USER:-wikicook}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-wikicook}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
      # V102-V104 (spec 010) are lower than V403 that already ran (research R11)
      FLYWAY_OUT_OF_ORDER: "true"
    volumes:
      - ./wikicook-db/src/main/resources/db/migration:/flyway/sql:ro

volumes:
  pgdata:
  media:
